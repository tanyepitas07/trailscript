<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrailScript - EHR launch</title>
<style>
 body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fbfcfb;color:#16211c;
      font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px}
 .box{max-width:560px;padding:26px 28px;border:1px solid #dbe3de;border-radius:14px;background:#fff;
      box-shadow:0 8px 24px -12px rgba(22,33,28,.18)}
 h1{font-size:17px;margin:0 0 8px}
 p{color:#5b6b63;margin:0 0 12px}
 code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#f2f6f3;padding:1px 5px;border-radius:4px;word-break:break-all}
 .err{color:#a13226}
 a{color:#1f6b4a}
 ol{color:#5b6b63;padding-left:20px}
 li{margin-bottom:7px}
 .k{border:1px solid #dbe3de;border-radius:8px;padding:8px 10px;width:100%;font:inherit;margin-bottom:8px}
 .btn{background:#1f6b4a;color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:650;cursor:pointer}
 @media (prefers-color-scheme:dark){
   body{background:#121816;color:#e6ece8}
   .box{background:#171f1c;border-color:#2b3833}
   p,ol{color:#9db0a6} code{background:#1a221f} a{color:#5fbf8f}
   .k{background:#1a221f;border-color:#2b3833;color:#e6ece8}
 }
</style>
</head>
<body>
<div class="box">
  <h1 id="h">Connecting to the EHR...</h1>
  <p id="m">Requesting patient context from the FHIR server.</p>
  <div id="d" hidden></div>
</div>
<script src="fhir-client.min.js"></script>
<script>
/* SMART on FHIR EHR launch.
 *
 * A SMART-conformant EHR opens this page with ?iss=<fhir base>&launch=<token>.
 * Both are handed to the SMART client, which runs the OAuth2 authorization-code
 * flow and returns to index.html with an access token. Scopes are read-only and
 * minimal: this app never writes to the chart.
 *
 * CLIENT_ID: the public SMART sandbox accepts any client id for a public client,
 * so the default below works today with no registration. Epic issues its own
 * non-production client id once a UserWeb account is approved; drop it in here or
 * set localStorage.trailscript_client_id and nothing else changes.
 */
var CLIENT_ID = (function(){
  try { return localStorage.getItem('trailscript_client_id') || 'trailscript-nonprod'; }
  catch(e){ return 'trailscript-nonprod'; }
})();

var params = new URLSearchParams(location.search);
var iss = params.get('iss');

function panel(title, msg, html, isErr){
  document.getElementById('h').textContent = title;
  document.getElementById('h').className = isErr ? 'err' : '';
  document.getElementById('m').textContent = msg;
  var d = document.getElementById('d');
  if (html){ d.hidden = false; d.innerHTML = html; }
}

if (!iss) {
  panel('No EHR launch context',
    'This page is meant to be opened by an EHR, which supplies iss and launch parameters. Two ways to see it work:',
    '<ol>'
    + '<li><b>Use the tool directly.</b> <a href="index.html">Open TrailScript</a> and type a ZIP code. This is the Plan B path and needs no EHR at all.</li>'
    + '<li><b>Simulate a real EHR launch.</b> Go to <a href="https://launch.smarthealthit.org" target="_blank" rel="noopener">launch.smarthealthit.org</a>, '
    + 'pick a patient, set the App Launch URL to <code>' + location.href.split('?')[0] + '</code>, and click Launch. '
    + 'The patient ZIP code is read from the chart and the search runs itself.</li>'
    + '</ol>'
    + '<p style="margin-top:14px">Client ID in use: <code>' + CLIENT_ID + '</code></p>'
    + '<input class="k" id="cid" placeholder="Paste an Epic non-production client ID here">'
    + '<button class="btn" id="save">Save client ID</button>');
  var s = document.getElementById('save');
  if (s) s.addEventListener('click', function(){
    var v = (document.getElementById('cid').value||'').trim();
    if (!v) return;
    try { localStorage.setItem('trailscript_client_id', v); alert('Saved. Relaunch from the EHR to use it.'); }
    catch(e){ alert('This browser blocked local storage; edit CLIENT_ID in launch.html instead.'); }
  });
} else {
  FHIR.oauth2.authorize({
    clientId: CLIENT_ID,
    scope: 'launch openid fhirUser patient/Patient.read',
    redirectUri: 'index.html',
    iss: iss
  }).catch(function(e){
    panel('Authorization failed', String(e && e.message || e),
      '<p>You can still use the tool without EHR context: <a href="index.html">open TrailScript</a> and enter a ZIP code.</p>', true);
  });
}
</script>
</body>
</html>
